name: codex-demo-cybersoc
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${DEMO_PORT:-8101}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://demo:demo@db:5432/demo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  demo_data:
